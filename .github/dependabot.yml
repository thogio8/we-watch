# Weekly dependency updates as PRs; the CI says at once whether they break.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The CI cannot catch this one (newer types compile fine): types
      # follow the Node that runs the app: 24 on Vercel and in CI
      # (package.json engines). Bump them together when moving to Node 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch bumps together: one PR to review, not twenty.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
