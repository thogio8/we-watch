# Weekly dependency updates as PRs; the CI says at once whether they break.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types follow the Node actually run (22: package.json engines, CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 waits for typescript-eslint to support it (peer < 6.1).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch bumps together: one PR to review, not twenty.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
