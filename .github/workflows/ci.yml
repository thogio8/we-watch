# The only road to production (Vercel's Git auto-deploy is off, vercel.json).
# Three jobs run side by side, the release waits for all of them:
#   checks  → format, lint, types, duplicates, dead code, unit tests
#   e2e     → build + Playwright, split over two machines (the two jobs
#             together = `npm run ci`, the local pre-push hook, lefthook.yml)
#   build   → main only: builds and uploads the production deployment
#             without putting it online (--skip-domain)
#   release → main only, once all are green: backup, migrate, put the new
#             deployment online, smoke test, roll back if it fails.
#   version → once production is up: names what is live (semver from the
#             commit types, release-please-config.json).
name: CI

# Version files only (the release PR): nothing to check nor deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:checks

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runs in the Playwright Docker image (scripts/e2e.sh).
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Install scripts run here (the build needs them), without any secret:
      # the Vercel token lives on the next step only.
      - run: npm ci
      # The Vercel CLI is a devDependency at an exact version (package.json,
      # lockfile integrity, Dependabot bumps it): npx --no never downloads.
      # `vercel pull` writes production's variables on the runner and `vercel
      # build` runs with them: no step may come after this one.
      - name: Build and upload, not online yet
        id: upload
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --no vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --no vercel build --prod --token="$VERCEL_TOKEN"
          url="$(npx --no vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  release:
    needs: [checks, e2e, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One release at a time, never cancelled halfway through a migration.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    # Each secret is set on the steps that use it, never on the job: npm ci
    # (dependencies' code) sees none of them.
    env:
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # No install script: the migration (drizzle-kit, its esbuild through
      # the platform package) and the backup (@libsql/client, prebuilt
      # binding) work without them.
      - run: npm ci --ignore-scripts

      # Encrypted with BACKUP_KEY, set on this step only. Missing or malformed
      # key: this step fails, so nothing is migrated nor deployed.
      - name: Backup every app table (encrypted)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: node scripts/backup-db.mjs backup/db.json.enc
      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.sha }}
          path: backup/
          if-no-files-found: error
          retention-days: 90

      - name: Migrate the database (before the code that needs it)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:migrate

      - name: Remember the deployment in production
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: echo "id=$(bash scripts/vercel-prod.sh current)" >> "$GITHUB_OUTPUT"

      - name: Put the new deployment online
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/vercel-prod.sh promote "${{ needs.build.outputs.url }}"

      - name: Smoke test production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/smoke-prod.sh

      - name: Roll back if production is broken
        if: failure() && steps.previous.outputs.id != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/vercel-prod.sh promote "${{ steps.previous.outputs.id }}"

  # fix → x.y.Z, feat → x.Y.0, feat! → X.0.0; refactor, test, ci, docs and
  # chore publish nothing. release-please opens its PR (CHANGELOG.md,
  # version.txt), it is merged at once (the code is already live), then
  # release-please tags vX.Y.Z and publishes the GitHub release. Changes made
  # with this job's token start no workflow: no second run of the CI.
  version:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: version
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update the release PR
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge it, if there is something to publish
        id: merge
        run: |
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --label "autorelease: pending" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag and publish the release
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
