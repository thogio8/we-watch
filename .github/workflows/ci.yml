# The only road to production (Vercel's Git auto-deploy is off, vercel.json).
# Three jobs run side by side, the release waits for all of them:
#   checks  → format, lint, types, duplicates, dead code, unit tests
#   e2e     → build + Playwright (the two together = `npm run ci`, the
#             local pre-push hook, lefthook.yml)
#   build   → main only: builds and uploads the production deployment
#             without putting it online (--skip-domain)
#   release → main only, once all are green: backup, migrate, put the new
#             deployment online, smoke test, roll back if it fails.
# Free on a private repo (2,000 minutes a month).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:checks

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runs in the Playwright Docker image (scripts/e2e.sh).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and upload, not online yet
        id: upload
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          url="$(npx vercel@latest deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  release:
    needs: [checks, e2e, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One release at a time, never cancelled halfway through a migration.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://we-watch-lac.vercel.app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD_URL: https://we-watch-lac.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Backup the movies table
        run: node scripts/backup-db.mjs backup/movies.json
      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.sha }}
          path: backup/
          retention-days: 90

      - name: Migrate the database (before the code that needs it)
        run: npm run db:migrate

      - name: Remember the deployment in production
        id: previous
        run: echo "id=$(bash scripts/vercel-prod.sh current)" >> "$GITHUB_OUTPUT"

      - name: Put the new deployment online
        run: bash scripts/vercel-prod.sh promote "${{ needs.build.outputs.url }}"

      - name: Smoke test production
        run: bash scripts/smoke-prod.sh

      - name: Roll back if production is broken
        if: failure() && steps.previous.outputs.id != ''
        run: bash scripts/vercel-prod.sh promote "${{ steps.previous.outputs.id }}"
