# The only road to production (Vercel's Git auto-deploy is off, vercel.json):
#   ci      → the same `npm run ci` as the local pre-push hook (lefthook.yml)
#   deploy  → main only, once ci is green: backup, migrate, deploy, smoke test,
#             and roll back if the smoke test fails.
# Free on a private repo (2,000 minutes a month).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # End-to-end tests run in the Playwright Docker image (scripts/e2e.sh).
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time, never cancelled halfway through a migration.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://we-watch-lac.vercel.app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD_URL: https://we-watch-lac.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Backup the movies table
        run: node scripts/backup-db.mjs backup/movies.json
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: backup/
          retention-days: 90

      - name: Migrate the database (before the code that needs it)
        run: npm run db:migrate

      - name: Remember the deployment in production
        id: previous
        run: echo "id=$(bash scripts/vercel-prod.sh current)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          url="$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          # Explicit: after a rollback, Vercel stops promoting new deploys.
          bash scripts/vercel-prod.sh promote "$url"

      - name: Smoke test production
        run: bash scripts/smoke-prod.sh

      - name: Roll back if production is broken
        if: failure() && steps.previous.outputs.id != ''
        run: bash scripts/vercel-prod.sh promote "${{ steps.previous.outputs.id }}"
